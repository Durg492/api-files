spring.application.name=PaymentServices
server.port=8083

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/ecomproject
spring.datasource.username=root
spring.datasource.password=Mysql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Actuator
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,refresh
management.endpoint.health.show-details=when-authorized


# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# Tracing
management.tracing.sampling.probability=1.0

# Show application, traceId and spanId in logs
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false

# Zipkin
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
