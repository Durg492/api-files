# Application
spring.application.name=OrderServices
server.port=8082

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/ecomproject
spring.datasource.username=root
spring.datasource.password=Mysql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



# Spring Session with Redis
spring.session.store-type=redis
# Redis
spring.data.redis.host=https://primary-tetra-200120.upstash.io
spring.data.redis.port=6379
# Uncomment if Redis requires authentication
spring.data.redis.password=gQAAAAAAAw24AAIgcDJiNTAzN2U3N2YxNmY0Njk5OTRhN2VjN2IzOTYwMTA0Mw

# Actuator
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings
management.endpoint.health.show-details=when-authorized

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.StringDeserializer
